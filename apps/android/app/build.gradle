plugins {
    id "com.android.application"
}

android {
    namespace = "com.flownote.fieldapp"
    compileSdk = 35

    defaultConfig {
        applicationId = "com.flownote.fieldapp"
        minSdk = 26
        targetSdk = 35
        versionCode = 2
        versionName = "0.2.0"
        testInstrumentationRunner = "android.test.InstrumentationTestRunner"
        manifestPlaceholders = [usesCleartextTraffic: "false"]
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    def releaseKeystore = System.getenv("FLOWNOTE_ANDROID_KEYSTORE")
    def releaseAlias = System.getenv("FLOWNOTE_ANDROID_KEY_ALIAS")
    def releaseStorePassword = System.getenv("FLOWNOTE_ANDROID_STORE_PASSWORD")
    def releaseKeyPassword = System.getenv("FLOWNOTE_ANDROID_KEY_PASSWORD")
    def releaseSigningReady = [releaseKeystore, releaseAlias, releaseStorePassword, releaseKeyPassword]
            .every { it != null && !it.trim().isEmpty() }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile = file(releaseKeystore)
                storePassword = releaseStorePassword
                keyAlias = releaseAlias
                keyPassword = releaseKeyPassword
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
                enableV4Signing = true
            }
        }
    }

    buildTypes {
        debug {
            manifestPlaceholders = [usesCleartextTraffic: "false"]
        }
        release {
            minifyEnabled = false
            manifestPlaceholders = [usesCleartextTraffic: "false"]
            if (releaseSigningReady) {
                signingConfig = signingConfigs.release
            }
        }
    }

    gradle.taskGraph.whenReady { graph ->
        boolean requestsRelease = graph.allTasks.any {
            it.project == project && it.name.toLowerCase(java.util.Locale.ROOT).contains("release")
        }
        if (requestsRelease && !releaseSigningReady) {
            throw new GradleException(
                    "운영 release 서명 환경변수 4개(FLOWNOTE_ANDROID_KEYSTORE, " +
                            "FLOWNOTE_ANDROID_KEY_ALIAS, FLOWNOTE_ANDROID_STORE_PASSWORD, " +
                            "FLOWNOTE_ANDROID_KEY_PASSWORD)가 모두 필요합니다.")
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.add("-Werror")
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
