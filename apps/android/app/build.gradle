plugins {
    id "com.android.application"
}

android {
    namespace "com.flownote.fieldapp"
    compileSdk 35

    defaultConfig {
        applicationId "com.flownote.fieldapp"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "0.1.0"
        testInstrumentationRunner "android.test.InstrumentationTestRunner"
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }
}

dependencies {
    testImplementation "junit:junit:4.13.2"
}
