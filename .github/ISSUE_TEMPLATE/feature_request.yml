name: 개선 제안
description: 현재 제품 방향 안의 개선 사항을 제안합니다.
title: "[개선] "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        FlowNote는 문서와 현장 경험을 연결하는 연구 프로토타입입니다. 실제 고객 정보나 비공개 운영 자료는 적지 마세요.
  - type: textarea
    id: problem
    attributes:
      label: 해결하려는 문제
      description: 특정 구현보다 먼저 사용자·현장 문제와 현재 불편을 설명해 주세요.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 제안하는 개선
      description: Windows·Android 역할 분리와 원천 기록 보존에 어떤 영향을 주는지 적어 주세요.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: 관련 구성요소
      options:
        - FastAPI 서버
        - Windows WPF
        - Android
        - 문서·빌드·자동화
        - 여러 구성요소
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 완료 확인 방법
      description: 합성 데이터로 재현 가능한 검증 기준을 적어 주세요.
    validations:
      required: true
  - type: checkboxes
    id: scope_check
    attributes:
      label: 범위 확인
      options:
        - label: 실제 고객 데이터, 자격 증명, 운영 주소와 개인 로컬 경로를 포함하지 않았습니다.
          required: true
